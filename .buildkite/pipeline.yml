---
steps:
  - group: ":debian: Build & Package"
    steps:
      - label: "build package (amd64)"
        command: ".buildkite/build.sh"
        artifact_paths:
          - "build-*/*"
        agents:
          queue: default
      - label: "build package (arm64)"
        command: ".buildkite/build.sh"
        artifact_paths:
          - "build-*/*"
        agents:
          queue: default_arm64

  - wait: ~

  - label: ":debian: Publish deb"
    command: ".buildkite/publish-deb.sh"
    retry:
      automatic: true
    plugins:
      artifacts#v1.2.0:
        download: "build-*/*.deb"
      docker#v1.4.0:
        image: "${ECR}/ci-tools"
        always-pull: true
        workdir: /src
        environment:
          - APTLY_UNAME
          - APTLY_PASSWD
